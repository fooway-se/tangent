<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Tangent · Projects</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/app.html" aria-label="Tangent home">Tangent</a>
      <div id="account-bar" class="account-bar" hidden>
        <span id="current-user"></span>
        <button id="logout-button" class="button button-quiet" type="button">Sign out</button>
      </div>
    </header>

    <main class="page-shell">
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

      <section id="login-panel" class="panel login-panel" aria-labelledby="login-heading">
        <p class="eyebrow">Your workspace</p>
        <h1 id="login-heading">Sign in to Tangent</h1>
        <form id="login-form" class="form-stack">
          <label>Email
            <input name="email" type="email" autocomplete="username" required>
          </label>
          <label>Password
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="button button-primary" type="submit">Sign in</button>
        </form>
      </section>

      <section id="workspace-panel" hidden>
        <div class="page-heading">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1>Projects</h1>
          </div>
        </div>

        <section id="admin-tools" class="admin-grid" hidden>
          <article class="panel">
            <h2>New project</h2>
            <form id="project-form" class="form-stack">
              <label>Name
                <input name="name" maxlength="120" required>
              </label>
              <label>Description
                <textarea name="description" rows="3" maxlength="5000"></textarea>
              </label>
              <button class="button button-primary" type="submit">Create project</button>
            </form>
          </article>
          <article class="panel">
            <h2>Add a developer</h2>
            <form id="developer-form" class="form-stack">
              <label>Name
                <input name="name" maxlength="120" required>
              </label>
              <label>Email
                <input name="email" type="email" maxlength="254" required>
              </label>
              <label>Temporary password
                <input name="password" type="password" minlength="12" autocomplete="new-password" required>
              </label>
              <button class="button button-secondary" type="submit">Add developer</button>
            </form>
          </article>
        </section>

        <section class="content-grid">
          <div>
            <h2 class="section-title">Your projects</h2>
            <ul id="project-list" class="project-list"></ul>
            <p id="empty-projects" class="empty-state" hidden>No projects yet.</p>
          </div>
          <aside id="project-detail" class="panel project-detail" hidden aria-live="polite"></aside>
        </section>
      </section>
    </main>
  </body>
</html>
