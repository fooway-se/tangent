openapi: 3.1.0
info:
  title: Tangent API
  version: 1.0.0
  description: Authentication, workspace membership and switching, internal project work, scoped coding-agent identities and issue tools, event inbox, and a permission-filtered guest client view.
servers:
  - url: /api/v1
security:
  - SessionCookie: []
  - BearerToken: []
paths:
  /github/repositories:
    get:
      summary: List GitHub repositories connected to this workspace (admin only)
      description: Repository names and URLs are visible only to workspace admins. Guests and developers cannot browse the connected repository list.
      responses:
        '200':
          description: GitHub App configuration and accessible repositories.
          content:
            application/json:
              schema:
                type: object
                required: [configured, can_connect, connected, repositories]
                properties:
                  configured: { type: boolean }
                  can_connect: { type: boolean, description: GitHub App and OAuth user authorization are configured. }
                  connected: { type: boolean }
                  repositories:
                    type: array
                    items: { $ref: '#/components/schemas/GitHubRepository' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /github/install:
    post:
      summary: Start connecting a GitHub App installation (admin only)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: GitHub App installation URL. The callback then requests user authorization before associating the installation.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: GitHub App or OAuth user authorization credentials are not configured. }
  /github/setup:
    get:
      summary: Continue GitHub installation setup with user authorization
      description: The GitHub App callback binds its installation ID to the original Tangent browser session and redirects to the GitHub OAuth callback. It does not associate the installation yet.
      parameters:
        - name: installation_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '302': { description: Browser redirects to GitHub user authorization. }
        '403': { description: The setup state is invalid, expired, or belongs to another session. }
  /github/setup/authorize:
    get:
      summary: Verify GitHub user access and complete installation setup
      description: Exchanges the one-time OAuth code and calls GitHub's list installations accessible to the authorized GitHub user endpoint before associating the installation with the workspace. The state is bound to the Tangent session that started setup and is consumed once.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '302': { description: Installation recorded; browser redirects to Tangent. }
        '403': { description: The state is invalid or expired, or the authorized GitHub user cannot access the installation. }
  /github/webhook:
    post:
      security: []
      summary: Receive signed GitHub pull-request and push events
      description: Validates the raw request body with HMAC-SHA256 before processing. Commit tracking is optional and requires the Push subscription plus read-only Contents permission on the connected GitHub App.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=' }
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string, maxLength: 100 }
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Signed event accepted or previously delivered. }
        '400': { description: Required webhook headers are missing or malformed. }
        '401': { description: Webhook signature is missing or invalid. }
  /issues/{id}/pull-requests:
    get:
      summary: List pull requests linked to an internal issue
      description: Available to project admins and developers with issue access. Guests cannot access pull-request metadata.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Manually linked pull requests, including links kept after disconnecting the project repository.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pull_requests:
                    type: array
                    items: { $ref: '#/components/schemas/LinkedPullRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Manually link a pull request to an issue
      description: The pull request URL must belong to the repository currently connected to the project. Linking is unavailable for completed or archived projects.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 500 }
      responses:
        '201':
          description: Pull request linked to the issue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pull_request: { $ref: '#/components/schemas/LinkedPullRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /issues/{id}/commits:
    get:
      summary: List commits linked to an internal issue
      description: Returns up to 50 commits received from pushes to the issue's generated Tangent branch. Available to project admins and developers with issue access; guests cannot access commit metadata.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Recent commits linked to the issue.
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items: { $ref: '#/components/schemas/LinkedCommit' }
        '404': { $ref: '#/components/responses/NotFound' }
  /issues/{id}/pull-requests/{pullRequestId}:
    delete:
      summary: Unlink a pull request from an issue
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: pullRequestId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Pull request unlinked. }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/login:
    post:
      security: []
      summary: Sign in and create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Signed in; the server sets session, active-workspace, and CSRF cookies.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token, expires_at]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  csrf_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/invites/inspect:
    post:
      security: []
      summary: Inspect a workspace invite link
      description: Public, rate-limited endpoint. The link token is sent in the JSON body, never in the URL. New global accounts choose a password after opening the link emailed to the invited address. Existing accounts authenticate with their current password. Pending invitations created before invite links were emailed may still require their existing verification code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Invite recipient and role details.
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite:
                    type: object
                    required: [name, email, workspace_name, role, project_ids, password_required, password_setup_required, email_verification_required]
                    properties:
                      name: { type: string }
                      email: { type: string, format: email }
                      workspace_name: { type: string }
                      role: { type: string, enum: [developer, guest] }
                      project_ids: { type: array, items: { type: integer } }
                      password_required: { type: boolean }
                      password_setup_required: { type: boolean, description: True when the invitee must create a global account password. }
                      email_verification_required: { type: boolean, description: True only for a pending legacy invitation that still has a separate verification code. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/invites/accept:
    post:
      security: []
      summary: Accept an invite and create a session
      description: Public, rate-limited, one-use token. New global accounts choose a password; existing accounts provide their current password. Pending invitations created before invite links were emailed may also require their existing verification code. Membership, guest project access, invite consumption, and session creation are atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
                password: { type: string, minLength: 15, maxLength: 128, description: Existing accounts provide their current password; new accounts choose a password. Any Unicode characters and spaces are allowed; validation also checks a common-password blocklist and account context. }
                verification_code: { type: string, pattern: '^[a-f0-9]{64}$', description: Required only for pending legacy invitations that still have a separate verification code. }
      responses:
        '200':
          description: Invite accepted; session, workspace, and CSRF cookies are set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token, expires_at]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  csrf_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-reset/complete:
    post:
      security: []
      summary: Set a new password using a reset token
      description: Public, rate-limited, one-use token. Revokes all active sessions and API tokens for the account across workspaces after a successful reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
                password: { type: string, minLength: 15, maxLength: 128, description: All Unicode characters and spaces are accepted; common, leaked, and contextual passwords are rejected. }
      responses:
        '204': { description: Password updated and existing sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      summary: Return the authenticated user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - { $ref: '#/components/schemas/User' }
                      - { $ref: '#/components/schemas/AgentPrincipal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Revoke the current session or API token
      description: Cookie-authenticated requests must include X-CSRF-Token. Bearer requests do not need CSRF protection.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Session revoked and browser cookies cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /workspaces:
    get:
      summary: List workspaces associated with the authenticated account
      responses:
        '200':
          description: Workspaces the current account can access.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
    post:
      summary: Create a workspace for another client (admin only)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '201':
          description: Workspace created and the creator added as an admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /workspaces/{id}/switch:
    post:
      security:
        - SessionCookie: []
      summary: Switch the browser session to another workspace
      description: Requires a browser session and X-CSRF-Token. The session is rotated and the old session revoked.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Active workspace changed; session, workspace, and CSRF cookies are replaced.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [user, workspace, csrf_token, expires_at]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  workspace: { $ref: '#/components/schemas/Workspace' }
                  csrf_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users:
    get:
      summary: List workspace users (admin only)
      responses:
        '200':
          description: Workspace users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a developer or guest (admin only)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 15, maxLength: 128, description: Password policy is shared with invite and reset flows. }
                role: { type: string, enum: [developer, guest], default: developer }
      responses:
        '201':
          description: Developer or guest created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users/invites:
    get:
      summary: List pending workspace invites (admin only)
      responses:
        '200':
          description: Pending invites without secret tokens.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      required: [id, name, email, role, project_ids, expires_at, created_at]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        email: { type: string, format: email }
                        role: { type: string, enum: [developer, guest] }
                        project_ids: { type: array, items: { type: integer } }
                        expires_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create and email a workspace invitation (admin only)
      description: Stores only a SHA-256 invite token hash and emails the single-use link to the invited address. The raw link is never returned to the admin or exposed by the pending invite list. Links expire after seven days and contain the token in the app URL fragment. Guest invites require at least one active project.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [developer, guest] }
                project_ids: { type: array, items: { type: integer, minimum: 1 }, description: Required for guests and empty for developers. }
      responses:
        '201':
          description: Invitation email sent. No invite secret is returned.
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite:
                    type: object
                    required: [id, email, name, role, project_ids, expires_at]
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      role: { type: string, enum: [developer, guest] }
                      project_ids: { type: array, items: { type: integer } }
                      expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Email delivery failed; no usable invite link was issued. }
  /users/invites/{id}/resend:
    post:
      summary: Resend a workspace invitation (admin only)
      description: Invalidates the previous token, creates a fresh seven-day invite link, and emails it to the invited address. The link secret is never returned to the admin.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Replacement invitation email sent. No invite secret is returned.
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite:
                    type: object
                    required: [id, email, name, role, project_ids, expires_at]
                    properties:
                      id: { type: integer }
                      email: { type: string, format: email }
                      name: { type: string }
                      role: { type: string, enum: [developer, guest] }
                      project_ids: { type: array, items: { type: integer } }
                      expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Email delivery failed; the previous invite link is no longer usable. }
  /users/invites/{id}:
    delete:
      summary: Revoke a pending workspace invite (admin only)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Invite revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/status:
    patch:
      summary: Activate or deactivate a workspace membership (admin only)
      description: Deactivation revokes the member's browser sessions and API tokens in this workspace and blocks workspace and project access. Reactivating the membership does not restore those credentials; the member must sign in again and create new API tokens. The account, credentials, and access in other workspaces remain. At least one active workspace admin must remain.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200':
          description: Updated workspace membership state.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/WorkspaceMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users/{id}/role:
    patch:
      summary: Change a workspace member's role (admin only)
      description: Updates the member's role in this workspace only. An admin cannot change their own role, and at least one active admin must remain.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, developer, guest] }
      responses:
        '200':
          description: Updated workspace membership role.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/WorkspaceMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users/{id}/projects:
    get:
      summary: List project access options for a guest member (admin only)
      description: Returns active and paused projects plus any completed or archived projects the guest already belongs to. Existing read-only memberships can be removed but cannot be newly granted.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Project IDs the guest currently belongs to and the options displayed in the access editor.
          content:
            application/json:
              schema:
                type: object
                required: [project_ids, projects]
                properties:
                  project_ids:
                    type: array
                    items: { type: integer }
                  projects:
                    type: array
                    items:
                      type: object
                      required: [id, name, status]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        status: { type: string, enum: [active, paused, completed, archived] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      summary: Replace a guest member's project access (admin only)
      description: New memberships can be granted only for active or paused projects in the current workspace. Existing completed or archived memberships may be retained or removed, but cannot be newly granted. An empty list removes all project access.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_ids]
              properties:
                project_ids:
                  type: array
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The guest member's project IDs after the update, including any retained read-only memberships.
          content:
            application/json:
              schema:
                type: object
                required: [project_ids]
                properties:
                  project_ids:
                    type: array
                    items: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users/{id}/password-reset:
    post:
      summary: Send a one-use password recovery email (admin only)
      description: Workspace admins can initiate delivery, but the reset link is sent only to the target account's email and is never returned to the admin. It expires after one hour. Successful completion changes the account-wide password and revokes all active sessions and API tokens across workspaces.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Recovery email submitted to the account's email address; the raw token is never returned.
          content:
            application/json:
              schema:
                type: object
                required: [expires_at]
                properties:
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Email delivery failed; no usable reset link was issued. }
  /tokens:
    get:
      summary: List the authenticated user's active API tokens
      responses:
        '200':
          description: Token metadata; secret values are never returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/TokenMetadata' }
    post:
      summary: Create an API token for the authenticated user
      description: The raw token is returned only once. Cookie-authenticated requests must include X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: New API token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenMetadata'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
  /tokens/{id}:
    delete:
      summary: Revoke an API token
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Token revoked. }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      summary: Poll visible project chat messages after a commit-ordered cursor
      description: Returns up to 100 committed events from projects the user can access, ordered by the workspace's transaction-serialized feed cursor. New clients should send cursor and resume from each event's feed_cursor. The deprecated since parameter accepts a legacy message ID and maps it to the feed cursor for compatibility. Matching If-None-Match returns 304.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Commit-ordered cursor returned as feed_cursor on each event.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: since
          in: query
          required: false
          deprecated: true
          description: Legacy message ID cursor. Accepted for existing clients and translated to the commit-ordered feed cursor.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Visible events and the current ETag.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '304':
          description: No visible events changed since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /events/stream:
    get:
      summary: Subscribe to workspace refresh signals
      description: Opens a same-origin Server-Sent Events stream for internal workspace users when SSE is enabled by the host and a global stream slot is available. SSE is disabled by default. The stream contains no application records; clients refetch changed resources through their normal authorized endpoints. EventSource reconnects with Last-Event-ID. The server sends heartbeat events and closes each connection after about 20 seconds.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Cursor from the latest ready or refresh event, supplied automatically by EventSource when reconnecting.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Server-Sent Events stream. Event types are ready, refresh, and heartbeat.
          content:
            text/event-stream:
              schema: { type: string }
        '204':
          description: SSE is disabled or the global stream connection limit has been reached; clients should continue polling and retry later.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects:
    get:
      summary: List projects visible to the authenticated user
      responses:
        '200':
          description: Workspace projects for admins, member projects for developers, and sanitized member projects for guests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Project'
                        - $ref: '#/components/schemas/GuestProject'
    post:
      summary: Create a project (admin only)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 5000 }
                github_installation_id: { type: [integer, 'null'], minimum: 1, description: Installation from this workspace that exposes the selected repository. Omitted installation IDs retain support for older clients. }
                github_repository_id: { type: [integer, 'null'], minimum: 1, description: Optional repository connected to this project. }
                github_repository_owner: { type: [string, 'null'], description: Selected repository owner; checked against GitHub when installation_id is supplied. }
                github_repository_name: { type: [string, 'null'], description: Selected repository name; checked against GitHub when installation_id is supplied. }
      responses:
        '201':
          description: Project created; creator becomes a member.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /roadmap:
    get:
      summary: List internal workspace milestones for the team roadmap
      description: Available to admins and developers. Developers see milestones only from projects they belong to. Archived projects and milestones are omitted. Task counts include internal and shared non-ongoing issues; issue titles and assignee identities are not returned. Guests cannot access this endpoint.
      responses:
        '200':
          description: Milestone progress and workload summaries, ordered by due date.
          content:
            application/json:
              schema:
                type: object
                required: [milestones]
                properties:
                  milestones:
                    type: array
                    items: { $ref: '#/components/schemas/RoadmapMilestone' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lounge/members:
    get:
      summary: List active internal Lounge members
      description: Returns active admins and developers in the current workspace for mention suggestions. Guests cannot access this endpoint.
      responses:
        '200':
          description: Workspace members available to mention in the Lounge.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/LoungeMentionMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lounge/messages:
    get:
      summary: Read or poll the workspace Lounge
      description: Returns the latest 100 messages when since is omitted, or messages after the supplied ID. Available to workspace admins and developers, not guests. Matching If-None-Match returns 304.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Lounge messages and the current channel ETag.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '304':
          description: No Lounge messages changed since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Post to the workspace Lounge
      description: Cookie-authenticated requests must include X-CSRF-Token. The Lounge is internal to the workspace and does not create project inbox events. Threads support at most 32 messages including the root; deeper replies return 422.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                parent_id: { type: [integer, 'null'], minimum: 1 }
      responses:
        '201':
          description: Lounge message created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /lounge/presence:
    get:
      summary: List members currently in the workspace Lounge
      description: Returns active internal workspace members who sent a Lounge heartbeat within the last 45 seconds. This read-only request does not mark the requester as present. Guests cannot access this endpoint.
      responses:
        '200':
          description: Active members currently in the Lounge.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer, minimum: 1 }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Update presence in the workspace Lounge
      description: Records the authenticated member's active Lounge presence and returns active internal workspace members. Presence expires after 45 seconds without a heartbeat. Guests cannot access this endpoint.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Active members currently in the Lounge.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer, minimum: 1 }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}/presence:
    post:
      summary: Update viewer presence for a project
      description: Records the authenticated viewer's active presence and returns only whether another authorized project chat viewer has an active heartbeat. Presence expires after 45 seconds without a heartbeat.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Boolean indication that another viewer is active.
          content:
            application/json:
              schema:
                type: object
                required: [someone_else_viewing]
                properties:
                  someone_else_viewing: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{id}/messages:
    get:
      summary: Read recent project messages or poll for messages after an ID
      description: Returns the latest 100 messages when since is omitted. If since is supplied, returns messages with a larger ID. Matching If-None-Match returns 304.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: since
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Messages and the current channel ETag.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '304':
          description: No messages changed since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      summary: Post to a project channel or reply to a message
      description: Cookie-authenticated requests must include X-CSRF-Token. Message bodies are plain text. Threads support at most 32 messages including the root; deeper replies return 422.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                parent_id: { type: [integer, 'null'], minimum: 1 }
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{id}/events:
    get:
      summary: Poll chat messages for one project
      description: Returns up to 100 committed chat events from the requested project only. Project chat access is required. Events use the workspace's transaction-serialized feed cursor; matching If-None-Match returns 304. The deprecated since parameter accepts a legacy message ID and maps it to the project feed cursor.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: cursor
          in: query
          required: false
          description: Commit-ordered cursor returned as feed_cursor on each event.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: since
          in: query
          required: false
          deprecated: true
          description: Legacy message ID cursor. Accepted for existing clients and translated to the project feed cursor.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Project events and the current project-scoped ETag.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '304':
          description: No events changed in this project since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{id}/messages/{messageId}:
    get:
      summary: Read a specific project chat message
      description: Used to open a notification at its source. Requires project chat access.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: messageId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The requested message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{id}/issues/deleted:
    get:
      summary: List deleted issues in a project
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Soft-deleted issues available for restoration.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: '#/components/schemas/Issue' }
        '304':
          description: No deleted issues changed since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{id}/issues:
    get:
      summary: List issues in a project
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Active issues ordered by status and creation ID. Soft-deleted issues are excluded.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: '#/components/schemas/Issue' }
        '304':
          description: No active issues changed since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create an issue in a project
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                context: { type: string, maxLength: 10000, description: Background and constraints for implementing the issue. }
                expected_outcome: { type: string, maxLength: 10000, description: The result the issue should produce. }
                acceptance_criteria: { type: string, maxLength: 10000, description: Acceptance criteria, one criterion per line. }
                source_message_id: { type: [integer, 'null'], minimum: 1, description: Source message in this project; replies are linked to their thread root. }
                type: { type: string, enum: [task, bug, feature, research, maintenance], default: task }
                priority: { type: string, enum: [low, medium, high, urgent], default: medium }
                due_date: { type: [string, 'null'], format: date, description: Issue due date in YYYY-MM-DD format; null means no due date. }
                assignee_id: { type: [integer, 'null'], minimum: 1, description: Project member responsible for the issue; null means unassigned. }
                milestone_id: { type: [integer, 'null'], minimum: 1, description: Milestone in this project; null means no milestone. Requires issues.share. }
                is_ongoing: { type: boolean, default: false, description: Work that continues throughout the project. Requires issues.share. Ongoing issues cannot belong to a milestone or be marked done. }
                is_shared: { type: boolean, default: false, description: Share the issue with project guests. Requires issues.share. }
                approval_requested: { type: boolean, default: false, description: Request guest approval; requires is_shared to be true. }
      responses:
        '201':
          description: Issue created in Backlog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{id}/issues/move-to-milestone:
    post:
      summary: Move unassigned project issues into a milestone
      description: Moves the selected unassigned issues as one transaction. All issue IDs must belong to the project and target an active milestone. Requires issues.share.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_ids, milestone_id]
              properties:
                issue_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
                milestone_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Issues moved into the milestone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved_count: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: One or more selected issues are no longer unassigned.
        '422':
          description: Invalid issue IDs or an archived milestone.
  /inbox:
    get:
      summary: List open issues assigned to the authenticated user
      description: Returns active backlog, todo, doing, and testing issues across projects visible to the authenticated user, ordered by most recently updated. Matching If-None-Match returns 304.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Open assigned issues with project names and slugs.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items: { $ref: '#/components/schemas/InboxIssue' }
        '304':
          description: No assigned issues changed since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /inbox/events:
    get:
      summary: List inbox events for the authenticated user
      description: Mentions, assignments, thread replies, status changes and PR events addressed to the user. Without tab or before_id, returns the legacy newest 200 events. With tab, filters before limiting to 50 events and uses before_id as an exclusive stable ID cursor. Counts cover all currently visible projects. Matching If-None-Match returns 304.
      parameters:
        - name: tab
          in: query
          required: false
          schema: { type: string, enum: [unread, all, mentions, done] }
        - name: before_id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Events, newest first.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/InboxEvent' }
                  has_more: { type: boolean, description: Present for tab-filtered pages. }
                  next_cursor: { type: [integer, 'null'], description: Exclusive before_id cursor for the next page. }
                  counts:
                    type: object
                    properties:
                      unread: { type: integer, minimum: 0 }
                      mentions: { type: integer, minimum: 0 }
        '304':
          description: No inbox events changed since the supplied ETag.
          headers:
            ETag: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/events/{id}:
    patch:
      summary: Mark an inbox event read/unread or done/reopened
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read: { type: boolean }
                done: { type: boolean }
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event: { $ref: '#/components/schemas/InboxEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inbox/events/read-all:
    post:
      summary: Mark all of the user's inbox events read
      description: Marks every unread event in projects currently visible to the user, including events on pages they have not loaded.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: All events marked read. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}/client-view:
    get:
      summary: Client (guest) view of a project
      description: Progress, milestones, shared items, pending approvals and updates. Visibility is filtered server-side to content marked shared; ongoing issues remain internal and are omitted. Completed and archived projects remain readable but do not accept writes.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The client view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{id}/client-summary-updates:
    get:
      summary: List guest-visible issue updates for an admin-generated summary
      description: Only workspace admins can request client summary activity. The response uses the guest visibility filters and returns the total count plus the five most recent updates in the requested date range.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Client-visible summary updates.
          content:
            application/json:
              schema:
                type: object
                required: [total_count, updates]
                properties:
                  total_count: { type: integer, minimum: 0 }
                  updates:
                    type: array
                    items:
                      type: object
                      required: [id, text, created_at]
                      properties:
                        id: { type: integer }
                        text: { type: string }
                        created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /projects/{id}/client-comments:
    post:
      summary: Guest writes to the team (project channel)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Comment created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{id}/milestones:
    get:
      summary: List project milestones
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Milestones ordered by due date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestones:
                    type: array
                    items: { $ref: '#/components/schemas/Milestone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a project milestone
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                due_date: { type: [string, 'null'], format: date }
      responses:
        '201': { description: Milestone created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{id}/milestones/{milestoneId}:
    patch:
      summary: Update or archive a project milestone
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
        - name: milestoneId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                due_date: { type: [string, 'null'], format: date }
                archived: { type: boolean, description: Set true to hide its issues from Current work, or false to restore them. }
      responses:
        '200': { description: Milestone updated; the response includes archived_at. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      summary: Delete a milestone and unlink its issues
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
        - name: milestoneId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Milestone deleted; issue references cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /approvals/{id}/approve:
    post:
      summary: Approve a delivery marked for approval (guest)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Approval recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /issues/{id}:
    patch:
      summary: Update issue details and structured brief, priority, due date, status, sharing, milestone, or approval request
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                context: { type: string, maxLength: 10000, description: Background and constraints for implementing the issue. }
                expected_outcome: { type: string, maxLength: 10000, description: The result the issue should produce. }
                acceptance_criteria: { type: string, maxLength: 10000, description: Acceptance criteria, one criterion per line. }
                type: { type: string, enum: [task, bug, feature, research, maintenance] }
                priority: { type: string, enum: [low, medium, high, urgent] }
                due_date: { type: [string, 'null'], format: date, description: Issue due date in YYYY-MM-DD format; null clears the due date. }
                assignee_id: { type: [integer, 'null'], minimum: 1, description: Project member responsible for the issue; null means unassigned. }
                status: { type: string, enum: [backlog, todo, doing, testing, done, cancelled] }
                is_shared: { type: boolean, description: Whether this issue appears in the guest client view. }
                is_ongoing: { type: boolean, description: Whether this is continuing work. Requires issues.share. Ongoing issues cannot belong to a milestone or be marked done. }
                milestone_id: { type: [integer, 'null'], minimum: 1 }
                approval_requested: { type: boolean }
      responses:
        '200':
          description: Updated issue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      summary: Move an issue to Deleted issues
      description: Soft-deletes an issue from any status. It can be restored from the project's deleted issue list.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Issue moved to Deleted issues. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /issues/{id}/history:
    get:
      summary: List recent status transitions for an issue
      description: Returns the latest 20 status changes, newest first. Restricted to project members.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Recent status transitions.
          content:
            application/json:
              schema:
                type: object
                required: [transitions]
                properties:
                  transitions:
                    type: array
                    items:
                      type: object
                      required: [id, from_status, to_status, actor_name, created_at]
                      properties:
                        id: { type: integer }
                        from_status: { type: [string, 'null'], enum: [backlog, todo, doing, testing, done, cancelled, null] }
                        to_status: { type: string, enum: [backlog, todo, doing, testing, done, cancelled] }
                        actor_name: { type: string }
                        created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /issues/{id}/discussion:
    get:
      summary: List discussion messages for an issue
      description: Returns the issue's discussion in chronological order. Restricted to users who can read the issue's project.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Issue discussion messages.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/IssueDiscussionMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Add a message or reply to an issue discussion
      description: Restricted to users who can update the issue's project. Replies must target an existing message on the same issue.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                parent_id: { type: [integer, 'null'], minimum: 1, description: Existing message on this issue to reply to; null starts a new discussion message. }
      responses:
        '201':
          description: Discussion message created.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/IssueDiscussionMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /issues/{id}/discussion/{messageId}:
    patch:
      summary: Edit the author's last issue discussion message
      description: Only the message author can edit a message with no replies or later discussion messages. Restricted to users who can update the issue's project.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: messageId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '200':
          description: Updated discussion message.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/IssueDiscussionMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      summary: Delete the author's last issue discussion message
      description: Only the message author can delete a message with no replies or later discussion messages. Restricted to users who can update the issue's project.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: messageId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Discussion message deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /issues/{id}/restore:
    post:
      summary: Restore a deleted issue
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Restored issue with its previous status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /issues/{id}/move:
    post:
      summary: Move an open issue earlier or later within its milestone
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: string, enum: [up, down] }
      responses:
        '200':
          description: The reordered issue, including its saved sort_order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /messages/{id}/issue:
    post:
      summary: Create a project issue from a chat message
      description: Creates a Backlog issue using the message text as its title. For replies, the issue links to the root message of the thread.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Issue created from the message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{id}:
    get:
      summary: Read a project and its members
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: '#/components/schemas/Project' }
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a project (admin only)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 5000 }
                status: { type: string, enum: [active, paused, completed, archived] }
                github_installation_id: { type: [integer, 'null'], minimum: 1, description: Installation from this workspace that exposes the selected repository. Omitted installation IDs retain support for older clients. }
                github_repository_id: { type: [integer, 'null'], minimum: 1, description: Select or disconnect the project repository. }
                github_repository_owner: { type: [string, 'null'], description: Selected repository owner; checked against GitHub when installation_id is supplied. }
                github_repository_name: { type: [string, 'null'], description: Selected repository name; checked against GitHub when installation_id is supplied. }
      responses:
        '200': { description: Updated project. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{id}/notes:
    get:
      summary: Read internal project notes
      description: Notes are visible only to admins and project members with internal access. Guests cannot read them.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Markdown source and last update time; an empty page has a null update time.
          content:
            application/json:
              schema:
                type: object
                required: [notes, updated_at]
                properties:
                  notes: { type: string }
                  updated_at: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Save internal project notes
      description: Saves a single Markdown page visible only to admins and project members with internal access.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string, maxLength: 50000 }
      responses:
        '200': { description: The saved Markdown source and update time. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{id}/members:
    get:
      summary: List project members
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Project members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{id}/members/{userId}:
    put:
      summary: Add a workspace user to a project (admin only)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Member added or already present. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Remove a project member (admin only)
      description: All issues assigned to this member become unassigned.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Member removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents:
    get:
      summary: List agent identities in the workspace (admin only)
      responses:
        '200':
          description: Agent identities and their project and capability grants. Secret tokens are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentIdentity' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a scoped agent identity and its first token (admin only)
      description: The token secret is returned once. Agents are limited to selected active or paused projects and the selected issue capabilities. The token expires after 90 days by default.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, project_ids, capabilities]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                project_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
                capabilities:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [issues.read, issues.comment, issues.status.update] }
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '201':
          description: Agent identity and one-time token secret.
          content:
            application/json:
              schema:
                type: object
                required: [agent, token, expires_at]
                properties:
                  agent: { $ref: '#/components/schemas/AgentIdentity' }
                  token: { type: string, pattern: '^[a-f0-9]{64}$' }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /agents/{id}/tokens:
    post:
      summary: Rotate an agent token (admin only)
      description: Revokes existing active tokens for the agent and returns a new secret once. Expiry defaults to 90 days.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '201':
          description: New one-time token secret.
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, token, expires_at]
                properties:
                  agent_id: { type: integer }
                  token: { type: string, pattern: '^[a-f0-9]{64}$' }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agents/{id}:
    delete:
      summary: Revoke an agent and all its tokens (admin only)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Agent and its active tokens revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent/projects:
    get:
      summary: List projects this agent can read issues from
      description: Requires an agent bearer token with issues.read. Returns only active or paused projects granted to the agent.
      responses:
        '200':
          description: Project IDs and names available to the agent.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/AgentProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agent/projects/{id}/issues:
    get:
      summary: List active issues in an agent's granted project
      description: Requires an agent bearer token with issues.read. Returns non-deleted issues in Backlog, Todo, Doing, or Testing.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Issues available to the agent.
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items: { $ref: '#/components/schemas/AgentIssue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent/issues/{id}:
    get:
      summary: Read an issue through the agent API
      description: Requires an agent bearer token with issues.read and a project grant.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Issue details and saved prompt context.
          content:
            application/json:
              schema:
                type: object
                required: [issue]
                properties:
                  issue: { $ref: '#/components/schemas/AgentIssue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent/issues/{id}/discussion:
    post:
      summary: Add an issue progress note as an agent
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '201': { description: Discussion message attributed to the named agent. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agent/issues/{id}/status:
    patch:
      summary: Update an issue status as an agent
      description: Agents may move an open issue to Doing or Testing. They cannot complete, cancel, or reopen a closed issue.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [doing, testing] }
      responses:
        '200': { description: Updated issue and status history attributed to the named agent. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tangent_session
      description: Browser session; the tangent_workspace cookie selects its workspace, and mutating requests also need X-CSRF-Token.
    BearerToken:
      type: http
      scheme: bearer
      description: Opaque workspace-scoped API token. Human tokens retain their user's permissions; named agent tokens are restricted to explicit project and issue capability grants. Include X-Tangent-Workspace with the workspace ID when the token is for a non-default workspace.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema: { type: string }
  schemas:
    Workspace:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [admin, developer, guest] }
    User:
      type: object
      required: [id, workspace_id, name, email, role]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, developer, guest] }
    AgentPrincipal:
      type: object
      required: [id, workspace_id, name, role, principal_type]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        name: { type: string }
        role: { type: string, const: agent }
        principal_type: { type: string, const: agent }
    AgentIdentity:
      type: object
      required: [id, workspace_id, owner_user_id, name, is_active, project_ids, capabilities, created_at]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        owner_user_id: { type: integer }
        name: { type: string }
        is_active: { type: boolean }
        project_ids:
          type: array
          items: { type: integer }
        capabilities:
          type: array
          items: { type: string, enum: [issues.read, issues.comment, issues.status.update] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        token_expires_at: { type: string, format: date-time, nullable: true }
        token_last_used_at: { type: string, format: date-time, nullable: true }
    AgentProject:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        status: { type: string, enum: [active, paused] }
    AgentIssue:
      type: object
      required: [id, workspace_id, project_id, title, description, context, expected_outcome, acceptance_criteria, type, status, priority]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        project_id: { type: integer }
        title: { type: string }
        description: { type: string }
        context: { type: string }
        expected_outcome: { type: string }
        acceptance_criteria: { type: string }
        type: { type: string }
        status: { type: string, enum: [backlog, todo, doing, testing, done, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        due_date: { type: string, format: date, nullable: true }
        is_ongoing: { type: boolean }
        milestone_id: { type: integer, nullable: true }
        milestone_name: { type: string, nullable: true }
    WorkspaceMember:
      type: object
      required: [id, workspace_id, name, email, role, is_active, created_at]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, developer, guest] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    LoungeMentionMember:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    Project:
      type: object
      required: [id, workspace_id, name, slug, description, status, created_by]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, paused, completed, archived] }
        archived_from_status: { type: string, enum: [active, paused, completed], nullable: true }
        github_repository: { oneOf: [{ $ref: '#/components/schemas/GitHubRepository' }, { type: 'null' }] }
        created_by: { type: integer }
    GitHubRepository:
      type: object
      required: [id, installation_id, owner, name, full_name, html_url]
      properties:
        id: { type: integer, minimum: 1 }
        installation_id: { type: integer, minimum: 1 }
        owner: { type: string }
        name: { type: string }
        full_name: { type: string }
        html_url: { type: string, format: uri }
        private: { type: boolean, description: Present on repository-list responses; omitted from a project's saved repository reference. }
    LinkedPullRequest:
      type: object
      required: [id, github_repository_id, repository_full_name, pull_number, title, html_url, state, is_draft, author_login, github_updated_at, linked_at]
      properties:
        id: { type: integer }
        github_repository_id: { type: integer }
        repository_full_name: { type: string }
        pull_number: { type: integer, minimum: 1 }
        title: { type: string }
        html_url: { type: string, format: uri }
        state: { type: string, enum: [open, closed, merged] }
        is_draft: { type: boolean }
        author_login: { type: string }
        github_updated_at: { type: string, format: date-time }
        linked_at: { type: string, format: date-time }
    LinkedCommit:
      type: object
      required: [id, repository_full_name, sha, message, html_url, author_login, committed_at]
      properties:
        id: { type: integer }
        repository_full_name: { type: string }
        sha: { type: string, pattern: '^[a-f0-9]{40,64}$' }
        message: { type: string }
        html_url: { type: string, format: uri }
        author_login: { type: string }
        committed_at: { type: string, format: date-time }
    GuestProject:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    Message:
      type: object
      required: [id, channel_id, author_id, parent_id, author_name, author_role, parent_author_name, parent_body, reply_count, first_reply_id, body, created_at]
      properties:
        id: { type: integer }
        channel_id: { type: integer }
        author_id: { type: integer }
        author_name: { type: string }
        author_role: { type: string, enum: [admin, developer, guest] }
        parent_id: { type: [integer, 'null'] }
        parent_author_name: { type: [string, 'null'], description: Author of the replied-to message, or null for a root message. }
        parent_body: { type: [string, 'null'], description: Body of the replied-to message, or null for a root message. }
        reply_count: { type: integer, minimum: 0, description: Number of direct replies to this message. }
        first_reply_id: { type: [integer, 'null'], minimum: 1, description: ID of the earliest direct reply, or null when there are no replies. }
        body: { type: string }
        is_client_visible: { type: boolean, description: True when the message is shared directly or belongs to a client-visible conversation thread. }
        created_at: { type: string, format: date-time }
    IssueDiscussionMessage:
      type: object
      required: [id, issue_id, parent_id, author_id, author_name, parent_author_name, parent_body, body, created_at]
      properties:
        id: { type: integer }
        issue_id: { type: integer }
        parent_id: { type: [integer, 'null'], minimum: 1 }
        author_id: { type: integer }
        author_agent_id: { type: [integer, 'null'], description: Named agent identity for agent-authored messages. }
        author_name: { type: string }
        parent_author_name: { type: [string, 'null'] }
        parent_body: { type: [string, 'null'] }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Event:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [project_id, type, feed_cursor]
          properties:
            project_id: { type: integer }
            type: { type: string, enum: [message] }
            feed_cursor: { type: integer, minimum: 1, description: Commit-ordered cursor scoped to the workspace. }
    Issue:
      type: object
      required: [id, workspace_id, project_id, title, description, context, expected_outcome, acceptance_criteria, type, assignee_id, status, priority, due_date, created_by, source_channel_id, source_message_id, is_shared, is_ongoing, milestone_id, sort_order, discussion_count, approval_requested_at, approved_by, approved_at, created_at, updated_at, deleted_at]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        project_id: { type: integer }
        title: { type: string }
        description: { type: string }
        context: { type: string, description: Background and constraints for implementing the issue. }
        expected_outcome: { type: string, description: The result the issue should produce. }
        acceptance_criteria: { type: string, description: Acceptance criteria, one criterion per line. }
        type: { type: string, enum: [task, bug, feature, research, maintenance], default: task }
        assignee_id: { type: [integer, 'null'], description: Project member responsible for the issue; null means unassigned. }
        is_shared: { type: boolean, default: false }
        is_ongoing: { type: boolean, default: false, description: Ongoing work is excluded from planned progress and cannot belong to a milestone or be marked done. }
        milestone_id: { type: [integer, 'null'] }
        sort_order: { type: integer, minimum: 0, description: Saved ordering within the issue's milestone; lower values come first. }
        discussion_count: { type: integer, minimum: 0, description: Number of posts and replies in this issue's discussion. }
        approval_requested_at: { type: [string, 'null'], format: date-time }
        approved_by: { type: [integer, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [backlog, todo, doing, testing, done, cancelled] }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        due_date: { type: [string, 'null'], format: date, description: Issue due date in YYYY-MM-DD format. }
        created_by: { type: integer }
        source_channel_id: { type: [integer, 'null'] }
        source_message_id: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
    InboxIssue:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [project_name, project_slug]
          properties:
            project_name: { type: string }
            project_slug: { type: string }
    InboxEvent:
      type: object
      required: [id, type, actor_name, summary, project_id, project_name, read, done, created_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [mention, assigned, reply, status, pr, commit] }
        actor_name: { type: string }
        summary: { type: string }
        detail: { type: [string, 'null'] }
        project_id: { type: integer }
        project_name: { type: string }
        issue_id: { type: [integer, 'null'] }
        message_id: { type: [integer, 'null'] }
        read: { type: boolean }
        done: { type: boolean }
        created_at: { type: string, format: date-time }
    Milestone:
      type: object
      required: [id, workspace_id, project_id, name, due_date, archived_at, created_at]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        project_id: { type: integer }
        name: { type: string }
        due_date: { type: [string, 'null'], format: date }
        archived_at: { type: [string, 'null'], format: date-time, description: Non-null when the milestone is archived.}
        created_at: { type: string, format: date-time }
    RoadmapMilestone:
      type: object
      required: [id, project_id, project_name, project_status, name, due_date, total_tasks, completed_tasks, remaining_tasks, assigned_team_members, tasks_without_team_assignee]
      properties:
        id: { type: integer }
        project_id: { type: integer }
        project_name: { type: string }
        project_status: { type: string, enum: [active, paused, completed] }
        name: { type: string }
        due_date: { type: [string, 'null'], format: date }
        total_tasks: { type: integer, minimum: 0, description: Non-deleted, non-cancelled, non-ongoing issues in the milestone. }
        completed_tasks: { type: integer, minimum: 0 }
        remaining_tasks: { type: integer, minimum: 0 }
        assigned_team_members: { type: integer, minimum: 0, description: Distinct active admins and developers assigned to remaining tasks. }
        tasks_without_team_assignee: { type: integer, minimum: 0, description: Remaining tasks that are unassigned or assigned to a guest or inactive member. }
    ClientView:
      type: object
      required: [project, progress, next_milestone, completed_this_week, approvals, milestones, items, updates, messages]
      properties:
        project:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            status: { type: string, enum: [active, paused, completed, archived] }
        progress:
          type: object
          properties: { percent: { type: integer }, done: { type: integer }, total: { type: integer } }
        next_milestone:
          type: [object, 'null']
          properties: { name: { type: string }, due_date: { type: [string, 'null'] } }
        completed_this_week: { type: integer }
        approvals:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, title: { type: string }, description: { type: string } }
        milestones:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, name: { type: string }, due_date: { type: [string, 'null'] }, done: { type: integer }, total: { type: integer } }
        items:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, title: { type: string }, description: { type: string }, status: { type: string, enum: [planned, doing, done] }, milestone_id: { type: [integer, 'null'] }, milestone_name: { type: [string, 'null'] } }
        updates:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, text: { type: string }, created_at: { type: string, format: date-time } }
        messages:
          type: array
          description: Latest messages in client-visible conversation threads, in chronological order. Internal threads are excluded.
          items:
            type: object
            required: [id, parent_id, author_id, author_name, body, created_at]
            properties:
              id: { type: integer }
              parent_id: { type: [integer, 'null'] }
              author_id: { type: integer }
              author_name: { type: string }
              body: { type: string }
              created_at: { type: string, format: date-time }
    TokenMetadata:
      type: object
      required: [id, label]
      properties:
        id: { type: integer }
        label: { type: string }
        token_type: { type: string, enum: [api] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
  responses:
    Unauthorized:
      description: Authentication is required or credentials are invalid.
    Forbidden:
      description: The authenticated user lacks permission.
    NotFound:
      description: The resource was not found in the current workspace.
    Conflict:
      description: The requested email or project name is already in use.
    ValidationFailed:
      description: One or more request values are invalid.
    CsrfFailed:
      description: A valid CSRF header is required for cookie-authenticated mutations.
    RateLimited:
      description: Too many requests were made in the rate-limit window.
