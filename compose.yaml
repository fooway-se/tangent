services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PHP_VERSION: ${TANGENT_PHP_VERSION:-8.4.27}
    working_dir: /workspace
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    ports:
      - "${TANGENT_HTTP_PORT:-8081}:8080"
    volumes:
      - .:/workspace
      - composer_vendor:/workspace/vendor
    environment:
      TANGENT_ENV: development
      TANGENT_DB_HOST: mysql
      TANGENT_DB_PORT: "3306"
      TANGENT_DB_NAME: tangent_test
      TANGENT_DB_USER: tangent
      TANGENT_DB_PASSWORD: tangent_dev_password
      TANGENT_WORKSPACE_ID: "1"
      TANGENT_COOKIE_SECURE: "false"
      TANGENT_APP_URL: "${TANGENT_APP_URL:-http://localhost:${TANGENT_HTTP_PORT:-8081}}"
      TANGENT_GITHUB_APP_ID: ${TANGENT_GITHUB_APP_ID:-}
      TANGENT_GITHUB_APP_SLUG: ${TANGENT_GITHUB_APP_SLUG:-}
      TANGENT_GITHUB_PRIVATE_KEY: ${TANGENT_GITHUB_PRIVATE_KEY:-}
      TANGENT_GITHUB_WEBHOOK_SECRET: ${TANGENT_GITHUB_WEBHOOK_SECRET:-}
      TANGENT_TEST_DB_HOST: mysql
      TANGENT_TEST_DB_PORT: "3306"
      TANGENT_TEST_DB_NAME: tangent_test_suite
      TANGENT_TEST_DB_USER: tangent
      TANGENT_TEST_DB_PASSWORD: tangent_dev_password
      TANGENT_INSTALL_TEST_DB_HOST: mysql
      TANGENT_INSTALL_TEST_DB_PORT: "3306"
      TANGENT_INSTALL_TEST_DB_NAME: tangent_installer_test
      TANGENT_INSTALL_TEST_DB_USER: tangent
      TANGENT_INSTALL_TEST_DB_PASSWORD: tangent_dev_password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: ${TANGENT_DB_IMAGE:-mysql}:${TANGENT_DB_VERSION:-8.4}
    environment:
      MYSQL_DATABASE: tangent_test
      MYSQL_USER: tangent
      MYSQL_PASSWORD: tangent_dev_password
      MYSQL_ROOT_PASSWORD: tangent_root_password
      MARIADB_DATABASE: tangent_test
      MARIADB_USER: tangent
      MARIADB_PASSWORD: tangent_dev_password
      MARIADB_ROOT_PASSWORD: tangent_root_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v healthcheck.sh >/dev/null 2>&1; then healthcheck.sh --connect --innodb_initialized; else mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent; fi",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ${TANGENT_DB_VOLUME:-mysql_data}:/var/lib/mysql
      - ./tests/Fixtures/create-installer-test-db.sql:/docker-entrypoint-initdb.d/20-installer-test-db.sql:ro

  frontend:
    image: node:22-alpine
    profiles: [frontend]
    working_dir: /workspace
    entrypoint: ["npm"]
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules

volumes:
  composer_vendor:
  frontend_node_modules:
  mysql_data:
  mariadb_data:
